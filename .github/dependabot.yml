version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # no proponer versiones con menos de una semana publicadas
    groups:                       # menores y parches juntos: un PR por semana; las mayores van solas
      nuget-menores:
        update-types: [minor, patch]
    ignore:                       # .NET 10 (LTS): los paquetes que siguen la versión del runtime no saltan de mayor
      - dependency-name: 'Microsoft.Extensions.*'
        update-types: [version-update:semver-major]
      - dependency-name: 'Microsoft.EntityFrameworkCore*'
        update-types: [version-update:semver-major]
      - dependency-name: 'Microsoft.AspNetCore.*'
        update-types: [version-update:semver-major]
      - dependency-name: 'System.*'
        update-types: [version-update:semver-major]
      - dependency-name: 'dotnet-ef'
        update-types: [version-update:semver-major]
      - dependency-name: 'Npgsql.EntityFrameworkCore.PostgreSQL'
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # no proponer versiones con menos de una semana publicadas
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]   # .NET 10 (LTS): el salto de mayor se decide en un ADR
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # no proponer versiones con menos de una semana publicadas
    groups:                       # menores y parches juntos: un PR por semana; las mayores van solas
      acciones-menores:
        update-types: [minor, patch]
